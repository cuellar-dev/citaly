<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Citaly · Reserva en los lugares de tu barrio</title>
    <meta
      name="description"
      content="Descubre barberías, restaurantes, veterinarias y más cerca de ti, mira cómo son por dentro y reserva tu turno o tu mesa en un par de toques."
    />
    <!-- Color de la barra del navegador en el móvil. Se cambia en vivo al
         alternar el tema (services/tema.js); estos son los de arranque. -->
    <meta name="theme-color" content="#121413" />
    <!-- Metadatos para Google y para la vista previa al compartir (WhatsApp,
         Telegram, Facebook, X). Son los de la portada: al cambiar de ruta los
         actualiza la app (hooks/useMetaPagina.js) y el deploy escribe los de cada
         ruta fija en su HTML (scripts/rutas-estaticas.mjs), que es lo que ve
         WhatsApp, porque no ejecuta JS. %VITE_SITE_URL% sale de vite.config.js. -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta name="application-name" content="Citaly" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Citaly" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Citaly · Reserva en los lugares de tu barrio" />
    <meta
      property="og:description"
      content="Descubre barberías, restaurantes, veterinarias y más cerca de ti, mira cómo son por dentro y reserva tu turno o tu mesa en un par de toques."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-citaly.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Citaly: reserva en los lugares de tu barrio" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Citaly · Reserva en los lugares de tu barrio" />
    <meta
      name="twitter:description"
      content="Descubre barberías, restaurantes, veterinarias y más cerca de ti, mira cómo son por dentro y reserva tu turno o tu mesa en un par de toques."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-citaly.png" />
    <meta name="twitter:image:alt" content="Citaly: reserva en los lugares de tu barrio" />
    <!-- Quién es Citaly para Google (nombre del sitio en los resultados y logo). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "%VITE_SITE_URL%/#sitio",
            "name": "Citaly",
            "url": "%VITE_SITE_URL%/",
            "inLanguage": "es",
            "publisher": { "@id": "%VITE_SITE_URL%/#organizacion" }
          },
          {
            "@type": "Organization",
            "@id": "%VITE_SITE_URL%/#organizacion",
            "name": "Citaly",
            "url": "%VITE_SITE_URL%/",
            "logo": "%VITE_SITE_URL%/logo-citaly.png"
          }
        ]
      }
    </script>
    <!-- Instalada en iPhone (Añadir a pantalla de inicio): a pantalla
         completa y con su nombre. El manifest lo añade el build (vite.config.js). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Citaly" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!-- Las fuentes se piden ya, en vez de esperar a que React pinte texto.
         fetchpriority="low": que no le quiten ancho de banda al JS, que es lo
         que de verdad bloquea la primera pintura en esta app. Deben ser los
         mismos archivos que los @font-face de src/index.css. -->
    <link rel="preload" href="%BASE_URL%fonts/quicksand-v1.woff2" as="font" type="font/woff2" crossorigin fetchpriority="low" />
    <link rel="preload" href="%BASE_URL%fonts/outfit-v1.woff2" as="font" type="font/woff2" crossorigin fetchpriority="low" />

    <!-- Fotos de demo (Unsplash): adelantar la conexión ahorra un viaje de
         ida y vuelta a la primera foto. Cuando las fotos vengan de nuestro
         servidor/CDN, cambiar este origen (ver docs/pendientes-backend.md). -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

    <!-- El tema se pone antes de pintar: si alguien eligió claro, la página
         no debe parpadear en oscuro al cargar. Por defecto, oscuro. -->
    <script>
      try {
        var tema = localStorage.getItem('citaly_tema') === 'claro' ? 'claro' : 'oscuro'
        document.documentElement.dataset.tema = tema
        if (tema === 'claro') {
          document.querySelector('meta[name="theme-color"]').content = '#f6f2ea'
        }
      } catch (e) {
        document.documentElement.dataset.tema = 'oscuro'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
