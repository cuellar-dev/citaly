<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Citaly</title>
    <!-- El tema se pone antes de pintar: si alguien eligió claro, la página
         no debe parpadear en oscuro al cargar. Por defecto, oscuro. -->
    <script>
      try {
        document.documentElement.dataset.tema =
          localStorage.getItem('citaly_tema') === 'claro' ? 'claro' : 'oscuro'
      } catch (e) {
        document.documentElement.dataset.tema = 'oscuro'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
