<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" role="img" aria-label="Taly intentando volar, en papel recortado" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Taly gordito intentando volar (papel recortado)</title>
  <defs>
    <!-- Pieza de papel: filo de tijera, canto crema y sombrita debajo -->
    <filter id="papel" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="r"/>
      <feDisplacementMap in="SourceGraphic" in2="r" scale="3" result="d"/>
      <feMorphology in="d" operator="dilate" radius="1.6" result="dil"/>
      <feFlood flood-color="#F7F1E4" result="cr"/>
      <feComposite in="cr" in2="dil" operator="in" result="borde"/>
      <feMerge result="m"><feMergeNode in="borde"/><feMergeNode in="d"/></feMerge>
      <feDropShadow in="m" dx="2.5" dy="4" stdDeviation="2.2" flood-color="#0E2E2A" flood-opacity=".3"/>
    </filter>
    <filter id="suave"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <!-- sombra en el suelo: bien grande y pegada, no se despega -->
  <ellipse cx="200" cy="388" rx="124" ry="12" fill="#0E2E2A" fill-opacity=".22" filter="url(#suave)"/>

  <!-- ala lejana, de lado derecho, más oscura -->
  <g filter="url(#papel)">
    <path d="M268 204 C308 194 350 172 384 138 C382 160 394 166 388 180 C400 192 390 204 376 210 C366 226 340 238 314 242 Z" fill="#2AA795"/>
  </g>

  <!-- patas: dobladas, con el esfuerzo -->
  <g filter="url(#papel)">
    <path d="M170 332 L166 366 L148 374 L152 380 L176 376 L186 372 L186 332 Z" fill="#FFD166"/>
    <path d="M214 333 L216 366 L198 374 L202 380 L228 377 L240 372 L234 333 Z" fill="#FFD166"/>
  </g>

  <!-- cuerpo: bien redondo y regordete -->
  <g filter="url(#papel)">
    <path d="M175 90 C215 72 246 98 249 138 C252 168 292 186 314 228 C336 284 292 336 200 338 C108 342 66 286 88 228 C108 182 150 164 152 128 C152 108 160 96 175 90 Z" fill="#4FD8C4"/>
  </g>

  <!-- barriga -->
  <g filter="url(#papel)">
    <path d="M212 224 C260 222 298 248 290 290 C282 324 234 332 198 324 C236 304 246 264 212 224 Z" fill="#BDF4E8"/>
  </g>

  <!-- ala cercana, batiendo hacia arriba con todas sus ganas -->
  <g filter="url(#papel)">
    <path d="M136 240 C94 236 54 208 26 158 C46 166 54 160 60 150 C64 172 78 176 86 170 C92 190 104 194 114 190 C122 206 136 210 148 206 C156 222 160 232 168 250 Z" fill="#2AA795"/>
  </g>
  <g filter="url(#papel)">
    <path d="M132 232 C100 226 72 204 52 172 C70 182 84 190 96 204 C108 216 120 224 132 232 Z" fill="#4FD8C4"/>
  </g>

  <!-- copete -->
  <g filter="url(#papel)">
    <path d="M168 96 C154 72 160 54 174 44 C178 60 188 64 192 78 C198 64 206 60 214 58 C214 74 204 88 196 96 Z" fill="#FFD166"/>
  </g>

  <!-- pico abierto, resoplando -->
  <g filter="url(#papel)">
    <path d="M247 128 L292 138 L247 142 Z" fill="#0E2E2A"/>
  </g>
  <g filter="url(#papel)">
    <path d="M246 112 C268 108 292 116 302 126 C284 138 262 138 247 134 Z" fill="#FFD166"/>
  </g>
  <g filter="url(#papel)">
    <path d="M247 144 C262 144 280 148 290 158 C274 164 258 162 246 158 Z" fill="#FFD166"/>
  </g>

  <!-- cara de esfuerzo: ojo apretado y ceja fruncida -->
  <g stroke="#0E2E2A" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M212 108 L232 118 L212 128" stroke-width="7"/>
    <path d="M202 94 L238 106" stroke-width="6"/>
  </g>

  <!-- gotas de sudor -->
  <g filter="url(#papel)">
    <path d="M178 120 C170 134 168 140 174 146 C180 150 188 146 186 138 C184 132 180 126 178 120 Z" fill="#BDF4E8"/>
  </g>
  <g filter="url(#papel)">
    <path d="M152 98 C146 108 145 112 149 116 C153 119 159 116 158 111 C156 106 154 102 152 98 Z" fill="#BDF4E8"/>
  </g>

  <!-- polvito del intento, nubes de papel -->
  <g filter="url(#papel)">
    <path d="M84 380 C70 378 66 364 78 360 C80 348 98 346 104 356 C118 352 128 364 120 374 C112 384 96 386 84 380 Z" fill="#F2EBDD"/>
  </g>
  <g filter="url(#papel)">
    <path d="M296 382 C284 380 280 368 290 364 C294 354 308 354 312 362 C324 360 332 370 326 378 C320 386 306 386 296 382 Z" fill="#F2EBDD"/>
  </g>

  <!-- plumitas sueltas -->
  <g filter="url(#papel)">
    <path d="M42 214 C50 204 66 206 70 214 C62 226 48 226 42 214 Z" fill="#4FD8C4"/>
  </g>
  <g filter="url(#papel)">
    <path d="M30 262 C36 255 47 256 50 262 C44 270 34 270 30 262 Z" fill="#2AA795"/>
  </g>
</svg>
