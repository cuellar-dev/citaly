<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Taly perdido, mirando a todos lados, con signos de pregunta" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Taly perdido (404, animado)</title>

  <style>
    /* Animación corta y en bucle: Taly mira a un lado, al otro, y le salen dudas */

    /* Respira suave, para que no se vea congelado */
    .respira { transform-origin: 200px 335px; animation: respira 5s ease-in-out infinite; }
    @keyframes respira {
      0%, 100% { transform: scale(1, 1); }
      50%      { transform: scale(1.012, 1.024); }
    }

    /* La cabeza gira de un lado a otro buscando */
    .cabeza { transform-origin: 190px 150px; animation: cabeza 5s ease-in-out infinite; }
    @keyframes cabeza {
      0%, 8%, 50%, 100% { transform: rotate(0deg); }
      18%, 30%          { transform: rotate(-3.5deg); }
      62%, 76%          { transform: rotate(3deg); }
    }

    /* El ojo se adelanta a la cabeza: primero mira, luego gira */
    .ojo { animation: ojo 5s ease-in-out infinite; }
    @keyframes ojo {
      0%, 8%, 48%, 100% { transform: translate(0, 0); }
      15%, 32%          { transform: translate(-6px, -1px); }
      58%, 78%          { transform: translate(5px, 1px); }
    }

    /* Ala que se levanta y baja, en gesto de duda */
    .ala { transform-origin: 150px 235px; animation: ala 2.5s ease-in-out infinite; }
    @keyframes ala {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(-8deg); }
    }

    /* La gotita de duda resbala y se va */
    .gota { transform-box: fill-box; transform-origin: center; opacity: 0; animation: gota 3.4s ease-in infinite; }
    @keyframes gota {
      0%   { opacity: 0; transform: translateY(-5px) scale(.6); }
      20%  { opacity: 1; transform: translateY(0) scale(1); }
      75%  { opacity: 1; transform: translateY(12px) scale(1); }
      100% { opacity: 0; transform: translateY(20px) scale(.9); }
    }

    /* Los signos de pregunta saltan uno tras otro, se mecen y se van */
    .q { transform-box: fill-box; transform-origin: 50% 100%; opacity: 0; animation: q 3.6s ease-in-out infinite; }
    .q1 { animation-delay: 0s; }
    .q2 { animation-delay: 1.2s; }
    .q3 { animation-delay: 2.4s; }
    @keyframes q {
      0%   { opacity: 0; transform: translateY(12px) scale(.3) rotate(-20deg); }
      12%  { opacity: 1; transform: translateY(0) scale(1.15) rotate(6deg); }
      20%  { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
      45%  { opacity: 1; transform: translateY(-3px) scale(1) rotate(-4deg); }
      70%  { opacity: 1; transform: translateY(-5px) scale(1) rotate(3deg); }
      90%  { opacity: 0; transform: translateY(-12px) scale(.9) rotate(0deg); }
      100% { opacity: 0; transform: translateY(-12px) scale(.9) rotate(0deg); }
    }

    /* Si el sistema pide menos movimiento, queda quieto con las preguntas visibles */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .q { opacity: 1; }
      .gota { opacity: 1; }
    }
  </style>

  <defs>
    <filter id="pulso" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <path id="cuerpo" d="M175 85 C215 68 246 94 249 134 C252 166 286 186 304 226 C324 278 286 328 200 330 C114 334 78 282 98 226 C116 180 150 162 152 126 C152 106 160 92 175 85 Z"/>
    <clipPath id="dentroCuerpo"><use href="#cuerpo"/></clipPath>

    <!-- Signo de pregunta: la curva SIN relleno (antes se rellenaba) y el punto lleno -->
    <g id="pregunta">
      <path d="M2 14 C0 -6 28 -8 28 10 C28 26 8 26 8 42" fill="none" stroke="currentColor"/>
      <circle cx="8" cy="56" r="3.8" fill="currentColor" stroke="none"/>
    </g>
  </defs>

  <g filter="url(#pulso)" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- sombrita en el suelo -->
    <path d="M120 372 C160 380 250 380 292 371" stroke="#0E2E2A" stroke-opacity=".25" stroke-width="5"/>
    <path d="M140 380 C180 386 235 386 270 380" stroke="#0E2E2A" stroke-opacity=".15" stroke-width="4"/>

    <!-- SIGNOS DE PREGUNTA: amarillo corrido detrás, tinta encima -->
    <g transform="translate(294 26) rotate(8) scale(1.6)">
      <g class="q q1">
        <use href="#pregunta" color="#FFD166" stroke-width="9" transform="translate(2 2)"/>
        <use href="#pregunta" color="#0E2E2A" stroke-width="4.5"/>
      </g>
    </g>
    <g transform="translate(26 62) rotate(-14) scale(1.05)">
      <g class="q q2">
        <use href="#pregunta" color="#FFD166" stroke-width="9" transform="translate(2 2)"/>
        <use href="#pregunta" color="#0E2E2A" stroke-width="4.5"/>
      </g>
    </g>
    <g transform="translate(348 176) rotate(14) scale(.85)">
      <g class="q q3">
        <use href="#pregunta" color="#FFD166" stroke-width="9" transform="translate(2 2)"/>
        <use href="#pregunta" color="#0E2E2A" stroke-width="4.5"/>
      </g>
    </g>

    <!-- Taly, un poco ladeado de tanto mirar -->
    <g transform="rotate(-4 200 340)">

      <!-- patas, quietas -->
      <g stroke="#0E2E2A" stroke-width="13">
        <path d="M178 326 L176 358 M176 358 L158 365 M176 358 L192 366"/>
        <path d="M226 327 L228 358 M228 358 L210 366 M228 358 L244 365"/>
      </g>
      <g stroke="#FFD166" stroke-width="6">
        <path d="M178 326 L176 358 M176 358 L158 365 M176 358 L192 366"/>
        <path d="M226 327 L228 358 M228 358 L210 366 M228 358 L244 365"/>
      </g>

      <g class="respira">

        <!-- relleno del cuerpo, desfasado del contorno -->
        <g transform="translate(4 3)">
          <use href="#cuerpo" fill="#4FD8C4"/>
          <g clip-path="url(#dentroCuerpo)">
            <path d="M205 214 C256 210 304 236 296 286 C288 328 236 336 190 326 C232 306 244 256 205 214 Z" fill="#BDF4E8"/>
            <g stroke="#8FE0D0" stroke-width="4">
              <path d="M240 250 l9 3 M254 266 l9 2 M232 276 l9 3 M250 289 l9 1 M232 300 l9 2 M262 248 l8 4"/>
            </g>
            <g stroke="#2FBDA8" stroke-width="4">
              <path d="M120 232 l-3 9 M108 255 l-2 9 M118 282 l2 8 M136 304 l4 7"/>
              <path d="M176 100 l8 3 M194 90 l9 1 M212 94 l8 3 M170 124 l7 -2 M168 148 l4 7 M188 168 l7 3"/>
              <path d="M268 206 l-4 8 M284 228 l-6 6 M292 252 l-8 4"/>
            </g>
          </g>
        </g>

        <!-- contorno del cuerpo, repasado -->
        <use href="#cuerpo" stroke="#0E2E2A" stroke-width="5"/>
        <g stroke="#0E2E2A" stroke-width="2" stroke-opacity=".45" transform="translate(-2 -2) rotate(.6 200 200)">
          <use href="#cuerpo"/>
        </g>

        <!-- ala levantada: relleno, plumas y contorno juntos -->
        <g class="ala">
          <g transform="translate(4 3)">
            <path d="M128 252 C100 238 62 202 48 150 C70 154 80 148 86 140 C92 160 106 166 114 162 C124 180 140 188 158 198 C152 222 144 242 128 252 Z" fill="#2AA795"/>
            <g stroke="#4FD8C4" stroke-width="4">
              <path d="M126 236 C106 220 84 192 72 164"/>
              <path d="M138 226 C120 212 104 196 94 176"/>
              <path d="M146 214 C134 204 122 196 112 184"/>
            </g>
          </g>
          <path d="M128 252 C100 238 62 202 48 150 C70 154 80 148 86 140 C92 160 106 166 114 162 C124 180 140 188 158 198 C152 222 144 242 128 252 Z" stroke="#0E2E2A" stroke-width="4"/>
        </g>

        <!-- cabeza -->
        <g class="cabeza">
          <path transform="translate(4 3)" d="M168 92 C156 70 160 52 174 42 C178 58 188 62 192 76 C198 62 206 58 214 56 C214 72 204 84 196 92 Z" fill="#FFD166"/>
          <path d="M168 92 C156 70 160 52 174 42 C178 58 188 62 192 76 C198 62 206 58 214 56 C214 72 204 84 196 92" stroke="#0E2E2A" stroke-width="4"/>

          <!-- pico entreabierto -->
          <path d="M250 138 L288 144 L250 147 Z" fill="#0E2E2A" stroke="none"/>
          <path transform="translate(4 3)" d="M246 112 C268 110 290 118 300 128 C282 138 262 140 247 138 Z" fill="#FFD166"/>
          <path d="M246 112 C268 110 290 118 300 128 C282 138 262 140 247 138" stroke="#0E2E2A" stroke-width="4"/>
          <path transform="translate(4 3)" d="M247 147 C262 147 278 151 288 159 C274 163 258 161 246 157 Z" fill="#FFD166"/>
          <path d="M247 147 C262 147 278 151 288 159 C274 163 258 161 246 157" stroke="#0E2E2A" stroke-width="4"/>

          <!-- ojo y ceja: se mueven un poco más que la cabeza -->
          <g class="ojo">
            <ellipse cx="224" cy="118" rx="9" ry="10.5" fill="#0E2E2A" stroke="none"/>
            <circle cx="221" cy="113" r="3.2" fill="#F2EBDD" stroke="none"/>
            <path d="M210 95 C219 86 233 86 241 95" stroke="#0E2E2A" stroke-width="3.5"/>
          </g>

          <!-- gotita de duda -->
          <path class="gota" d="M176 118 C168 132 166 138 172 144 C178 148 186 144 184 136 C182 130 178 124 176 118 Z" fill="#BDF4E8" stroke="#0E2E2A" stroke-width="3"/>
        </g>
      </g>
    </g>
  </g>
</svg>
