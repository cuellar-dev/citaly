<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Taly, dibujado a mano, mira una llave que flota junto a la puerta cerrada de un local">
  <title>Taly con la llave (a mano, animado)</title>

  <style>
    /* Mismo trazo que el Taly dormido de Perfil; misma animación que la
       antigua versión de plastilina. Taly mira la llave que flota, luego el
       candado de la puerta, se encoge (aplasta y estira) y da un saltito
       con el copete. Bucle de 4.8 s. */

    .flota { animation: flota 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0%; }
    @keyframes flota {
      0%, 100% { transform: translateY(0) rotate(-8deg); }
      50%      { transform: translateY(-9px) rotate(7deg); }
    }

    .sombra-llave { transform-box: fill-box; transform-origin: center; animation: sombra-llave 2.4s ease-in-out infinite; }
    @keyframes sombra-llave {
      0%, 100% { transform: scale(1); opacity: .28; }
      50%      { transform: scale(.78); opacity: .16; }
    }

    .cuerpo-taly { transform-origin: 200px 360px; animation: aplasta 4.8s ease-in-out infinite; }
    @keyframes aplasta {
      0%, 52%, 100% { transform: scale(1, 1); }
      58%           { transform: scale(1.05, .93); }
      66%           { transform: scale(.97, 1.05); }
      74%           { transform: scale(1.01, .99); }
    }

    .cabeza { transform-origin: 200px 170px; animation: cabeza 4.8s ease-in-out infinite; }
    @keyframes cabeza {
      0%, 8%, 100% { transform: rotate(0deg); }
      18%, 34%     { transform: rotate(7deg) translateY(2px); }
      42%, 52%     { transform: rotate(-5deg) translateY(-2px); }
      64%          { transform: rotate(0deg); }
    }

    .pupila { animation: pupila 4.8s ease-in-out infinite; }
    @keyframes pupila {
      0%, 8%, 100% { transform: translate(0, 0); }
      18%, 34%     { transform: translate(2px, 4px); }
      42%, 56%     { transform: translate(4px, -1px); }
      66%          { transform: translate(0, 0); }
    }

    .copete { transform-origin: 186px 92px; animation: copete 4.8s ease-in-out infinite; }
    @keyframes copete {
      0%, 66%, 100% { transform: rotate(0deg) translateY(0); }
      74%           { transform: rotate(-9deg) translateY(-10px); }
      82%           { transform: rotate(5deg) translateY(2px); }
      88%           { transform: rotate(0deg) translateY(0); }
    }

    .candado { transform-origin: 336px 262px; animation: candado 4.8s ease-in-out infinite; }
    @keyframes candado {
      0%, 44%, 60%, 100% { transform: rotate(0deg); }
      48%                { transform: rotate(-7deg); }
      52%                { transform: rotate(6deg); }
      56%                { transform: rotate(-3deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <defs>
    <!-- Temblor de pulso, fijo. La caja del filtro es todo el lienzo: si fuera
         la de cada forma, recortaría el grosor del trazo (la llave se cortaba). -->
    <filter id="pulso" filterUnits="userSpaceOnUse" x="-10" y="-10" width="420" height="420">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <path id="cuerpo" d="M175 85 C215 68 246 94 249 134 C252 166 286 186 304 226 C324 278 286 328 200 330 C114 334 78 282 98 226 C116 180 150 162 152 126 C152 106 160 92 175 85 Z"/>
    <path id="ala" d="M134 204 C166 182 218 198 236 240 C220 284 160 290 128 256 C118 238 120 218 134 204 Z"/>
    <clipPath id="dentroCuerpo"><use href="#cuerpo"/></clipPath>
    <!-- la puerta: 84 × 176, como la de la tienda, con un arco suave arriba -->
    <path id="puerta" d="M272 362 L272 222 C272 200 290 186 314 186 C338 186 356 200 356 222 L356 362 Z"/>
  </defs>

  <!-- suelo, a garabato -->
  <g filter="url(#pulso)" stroke-linecap="round" fill="none">
    <path d="M14 364 C110 370 260 368 390 362" stroke="#0E2E2A" stroke-opacity=".28" stroke-width="5"/>
    <path d="M40 374 C140 379 250 378 360 372" stroke="#0E2E2A" stroke-opacity=".14" stroke-width="4"/>
  </g>

  <!-- el local: un trozo de fachada y la puerta con su candado, todo a 1.3
       (apoyado en el suelo y pegado a la derecha) para que la puerta quede
       solo un poco más baja que Taly. Los trazos van divididos entre 1.3
       para que la tinta pese lo mismo que la de Taly. -->
  <g filter="url(#pulso)" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(392 362) scale(1.3) translate(-392 -362)">
      <path transform="translate(3 2.3)" d="M236 150 L392 150 L394 362 L234 362 Z" fill="#F2EBDD"/>
      <path d="M236 150 L392 150 L394 362 L234 362 Z" fill="none" stroke="#0E2E2A" stroke-width="3.1"/>
      <!-- cornisa y ladrillos sueltos -->
      <path d="M238 164 C290 166 340 166 390 164" fill="none" stroke="#0E2E2A" stroke-opacity=".35" stroke-width="1.9"/>
      <g stroke="#0E2E2A" stroke-opacity=".22" stroke-width="2.3" fill="none">
        <path d="M244 190 l14 0 M368 206 l14 0 M242 300 l14 0 M372 322 l12 0 M370 262 l12 0 M246 242 l10 0"/>
      </g>

      <!-- la puerta -->
      <use href="#puerta" transform="translate(2.3 1.5)" fill="#EF476F"/>
      <!-- tablones -->
      <g stroke="#0E2E2A" stroke-opacity=".4" stroke-width="1.9" fill="none">
        <path d="M300 192 L300 358 M328 192 L328 358"/>
      </g>
      <use href="#puerta" fill="none" stroke="#0E2E2A" stroke-width="3.1"/>
      <!-- la manilla -->
      <circle cx="344" cy="290" r="5" fill="#F2EBDD" stroke="#0E2E2A" stroke-width="2.3"/>

      <!-- el candado, colgado en el centro de la puerta -->
      <g transform="translate(-22 -18)">
        <g class="candado">
          <path d="M324 262 L324 246 C324 232 348 232 348 246 L348 262" fill="none" stroke="#0E2E2A" stroke-width="7.7"/>
          <path d="M324 262 L324 246 C324 232 348 232 348 246 L348 262" fill="none" stroke="#C9D3D1" stroke-width="3.1"/>
          <rect x="314" y="256" width="44" height="38" rx="9" transform="translate(2.3 1.5)" fill="#FFD166"/>
          <rect x="314" y="256" width="44" height="38" rx="9" fill="none" stroke="#0E2E2A" stroke-width="3.1"/>
          <circle cx="336" cy="271" r="4" fill="#0E2E2A"/>
          <path d="M336 274 L336 284" stroke="#0E2E2A" stroke-width="3.5"/>
        </g>
      </g>
    </g>
  </g>

  <!-- sombras de la llave y de Taly, a garabato -->
  <g filter="url(#pulso)" stroke-linecap="round" fill="none">
    <path class="sombra-llave" d="M140 359 C150 362 162 362 172 359" stroke="#0E2E2A" stroke-width="5"/>
    <path d="M36 360 C68 365 118 365 154 359" stroke="#0E2E2A" stroke-opacity=".25" stroke-width="5"/>
  </g>

  <!-- Taly, un poco a la izquierda para dejar sitio al local -->
  <g filter="url(#pulso)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <g transform="translate(-60 70) scale(.78)">
      <g class="cuerpo-taly">

        <!-- patas -->
        <g stroke="#0E2E2A" stroke-width="13">
          <path d="M180 326 L178 356 M178 356 L160 364 M178 356 L194 365"/>
          <path d="M226 327 L228 356 M228 356 L210 365 M228 356 L244 364"/>
        </g>
        <g stroke="#FFD166" stroke-width="6">
          <path d="M180 326 L178 356 M178 356 L160 364 M178 356 L194 365"/>
          <path d="M226 327 L228 356 M228 356 L210 365 M228 356 L244 364"/>
        </g>

        <!-- relleno del cuerpo, desfasado del contorno como pintado a mano -->
        <g transform="translate(4 3)">
          <use href="#cuerpo" fill="#4FD8C4"/>
          <g clip-path="url(#dentroCuerpo)">
            <path d="M205 214 C256 210 304 236 296 286 C288 328 236 336 190 326 C232 306 244 256 205 214 Z" fill="#BDF4E8"/>
            <g stroke="#8FE0D0" stroke-width="4">
              <path d="M240 250 l9 3 M254 266 l9 2 M232 276 l9 3 M250 289 l9 1 M232 300 l9 2 M262 248 l8 4"/>
            </g>
            <g stroke="#2FBDA8" stroke-width="4">
              <path d="M120 232 l-3 9 M108 255 l-2 9 M118 282 l2 8 M136 304 l4 7"/>
              <path d="M176 100 l8 3 M194 90 l9 1 M212 94 l8 3 M170 124 l7 -2 M168 148 l4 7 M188 168 l7 3"/>
              <path d="M268 206 l-4 8 M284 228 l-6 6 M292 252 l-8 4"/>
            </g>
          </g>
        </g>

        <!-- ala -->
        <g transform="translate(4 3)">
          <use href="#ala" fill="#2AA795"/>
          <g stroke="#4FD8C4" stroke-width="4">
            <path d="M148 218 C172 208 200 214 216 232"/>
            <path d="M142 236 C168 228 194 234 214 248"/>
            <path d="M144 254 C166 250 188 256 202 266"/>
          </g>
        </g>
        <use href="#ala" stroke="#0E2E2A" stroke-width="4"/>
        <path d="M160 246 C176 244 192 250 204 260" stroke="#0E2E2A" stroke-width="2.5" stroke-opacity=".5"/>

        <!-- contorno del cuerpo, repasado dos veces -->
        <use href="#cuerpo" stroke="#0E2E2A" stroke-width="5"/>
        <g stroke="#0E2E2A" stroke-width="2" stroke-opacity=".45" transform="translate(-2 -2) rotate(.6 200 200)">
          <use href="#cuerpo"/>
        </g>

        <!-- cabeza: copete, pico y ojo -->
        <g class="cabeza">
          <g class="copete">
            <path transform="translate(4 3)" d="M168 92 C156 70 160 52 174 42 C178 58 188 62 192 76 C198 62 206 58 214 56 C214 72 204 84 196 92 Z" fill="#FFD166"/>
            <path d="M168 92 C156 70 160 52 174 42 C178 58 188 62 192 76 C198 62 206 58 214 56 C214 72 204 84 196 92" stroke="#0E2E2A" stroke-width="4"/>
          </g>

          <path transform="translate(4 3)" d="M246 112 C268 112 290 122 300 134 C282 146 262 150 247 146 Z" fill="#FFD166"/>
          <path d="M246 112 C268 112 290 122 300 134 C282 146 262 150 247 146" stroke="#0E2E2A" stroke-width="4"/>
          <path d="M250 134 C266 134 282 134 298 134" stroke="#0E2E2A" stroke-width="3"/>

          <!-- ojo abierto, curioso -->
          <circle cx="224" cy="120" r="12" fill="#F2EBDD" stroke="#0E2E2A" stroke-width="3.5"/>
          <g class="pupila">
            <circle cx="226" cy="122" r="5.5" fill="#0E2E2A"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- la llave, flotando junto a la punta del ala: parece que la sujeta -->
  <g filter="url(#pulso)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <g transform="translate(154 214) scale(1.05)">
      <g class="flota">
        <g stroke="#0E2E2A">
          <circle cx="0" cy="0" r="15" stroke-width="11"/>
          <path d="M0 16 L0 64 M0 46 L12 46 M0 58 L10 58" stroke-width="10"/>
        </g>
        <g stroke="#FFD166">
          <circle cx="0" cy="0" r="15" stroke-width="4.5"/>
          <path d="M0 16 L0 64 M0 46 L12 46 M0 58 L10 58" stroke-width="4"/>
        </g>
      </g>
    </g>
  </g>
</svg>
