<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Taly dormido, dibujado a mano, respirando" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Taly dormido (a mano, animado)</title>

  <style>
    /* Misma animación que el Taly crayón dormido */

    .respira { transform-origin: 200px 335px; animation: respira 4.2s ease-in-out infinite; }
    @keyframes respira {
      0%, 100% { transform: scale(1, 1); }
      50%      { transform: scale(1.018, 1.036); }
    }

    .cabeza { transform-origin: 190px 150px; animation: cabeza 4.2s ease-in-out .25s infinite; }
    @keyframes cabeza {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(1.6px) rotate(-1.6deg); }
    }

    .ala { transform-origin: 170px 245px; animation: ala 4.2s ease-in-out .15s infinite; }
    @keyframes ala {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-2.2px) rotate(-1.6deg); }
    }

    .copete { transform-origin: 175px 90px; animation: copete 6.4s ease-in-out infinite; }
    @keyframes copete {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(-4deg); }
    }

    .sombra { transform-origin: 206px 376px; animation: sombra 4.2s ease-in-out infinite; }
    @keyframes sombra {
      0%, 100% { transform: scaleX(1); }
      50%      { transform: scaleX(1.035); }
    }

    .burbuja-nariz { transform-box: fill-box; transform-origin: 20% 50%; animation: burbuja 4.2s ease-in-out infinite; }
    @keyframes burbuja {
      0%, 100% { transform: scale(.7); }
      50%      { transform: scale(1.2); }
    }
    .burbuja-media { transform-box: fill-box; transform-origin: center; animation: media 4.2s ease-in-out .3s infinite; }
    @keyframes media {
      0%, 100% { transform: scale(.94); }
      50%      { transform: scale(1.08); }
    }

    .sueno { animation: sueno 6s ease-in-out infinite; }
    @keyframes sueno {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-5px); }
    }
    .carta { transform-box: fill-box; transform-origin: center; animation: carta 5s ease-in-out infinite; }
    @keyframes carta {
      0%, 100% { transform: rotate(-3deg); }
      50%      { transform: rotate(3deg); }
    }

    .z { transform-box: fill-box; transform-origin: center; opacity: 0; animation: z 5.4s ease-in-out infinite; }
    .z1 { animation-delay: 0s; }
    .z2 { animation-delay: 1.8s; }
    .z3 { animation-delay: 3.6s; }
    @keyframes z {
      0%   { opacity: 0; transform: translate(12px, 28px) scale(.5) rotate(6deg); }
      18%  { opacity: 1; }
      50%  { transform: translate(-3px, -4px) scale(.9) rotate(-5deg); }
      80%  { opacity: 1; }
      100% { opacity: 0; transform: translate(-20px, -46px) scale(1.15) rotate(5deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .z { opacity: 1; }
    }
  </style>

  <defs>
    <!-- Temblor de pulso, fijo: el dibujo se mueve por dentro de este filtro -->
    <filter id="pulso" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <path id="cuerpo" d="M175 85 C215 68 246 94 249 134 C252 166 286 186 304 226 C324 278 286 328 200 330 C114 334 78 282 98 226 C116 180 150 162 152 126 C152 106 160 92 175 85 Z"/>
    <path id="ala" d="M134 204 C166 182 218 198 236 240 C220 284 160 290 128 256 C118 238 120 218 134 204 Z"/>
    <clipPath id="dentroCuerpo"><use href="#cuerpo"/></clipPath>
  </defs>

  <!-- sombra en el suelo, a garabato -->
  <g filter="url(#pulso)" stroke-linecap="round" fill="none">
    <g class="sombra">
      <path d="M120 372 C160 380 250 380 292 371" stroke="#0E2E2A" stroke-opacity=".25" stroke-width="5"/>
      <path d="M140 380 C180 386 235 386 270 380" stroke="#0E2E2A" stroke-opacity=".15" stroke-width="4"/>
    </g>
  </g>

  <!-- Taly dormido, un poco ladeado -->
  <g filter="url(#pulso)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <g transform="translate(0 6) rotate(3 200 340)">

      <!-- patas, quietas -->
      <g stroke="#0E2E2A" stroke-width="13">
        <path d="M178 326 L176 358 M176 358 L158 365 M176 358 L192 366"/>
        <path d="M226 327 L228 358 M228 358 L210 366 M228 358 L244 365"/>
      </g>
      <g stroke="#FFD166" stroke-width="6">
        <path d="M178 326 L176 358 M176 358 L158 365 M176 358 L192 366"/>
        <path d="M226 327 L228 358 M228 358 L210 366 M228 358 L244 365"/>
      </g>

      <g class="respira">

        <!-- relleno del cuerpo, desfasado del contorno como pintado a mano -->
        <g transform="translate(4 3)">
          <use href="#cuerpo" fill="#4FD8C4"/>
          <g clip-path="url(#dentroCuerpo)">
            <path d="M205 214 C256 210 304 236 296 286 C288 328 236 336 190 326 C232 306 244 256 205 214 Z" fill="#BDF4E8"/>
            <g stroke="#8FE0D0" stroke-width="4">
              <path d="M240 250 l9 3 M254 266 l9 2 M232 276 l9 3 M250 289 l9 1 M232 300 l9 2 M262 248 l8 4"/>
            </g>
            <g stroke="#2FBDA8" stroke-width="4">
              <path d="M120 232 l-3 9 M108 255 l-2 9 M118 282 l2 8 M136 304 l4 7"/>
              <path d="M176 100 l8 3 M194 90 l9 1 M212 94 l8 3 M170 124 l7 -2 M168 148 l4 7 M188 168 l7 3"/>
              <path d="M268 206 l-4 8 M284 228 l-6 6 M292 252 l-8 4"/>
            </g>
          </g>
        </g>

        <!-- ala: relleno, plumas y contorno juntos para que se muevan a la vez -->
        <g class="ala">
          <g transform="translate(4 3)">
            <use href="#ala" fill="#2AA795"/>
            <g stroke="#4FD8C4" stroke-width="4">
              <path d="M148 218 C172 208 200 214 216 232"/>
              <path d="M142 236 C168 228 194 234 214 248"/>
              <path d="M144 254 C166 250 188 256 202 266"/>
            </g>
          </g>
          <use href="#ala" stroke="#0E2E2A" stroke-width="4"/>
          <path d="M160 246 C176 244 192 250 204 260" stroke="#0E2E2A" stroke-width="2.5" stroke-opacity=".5"/>
        </g>

        <!-- contorno del cuerpo, repasado dos veces -->
        <use href="#cuerpo" stroke="#0E2E2A" stroke-width="5"/>
        <g stroke="#0E2E2A" stroke-width="2" stroke-opacity=".45" transform="translate(-2 -2) rotate(.6 200 200)">
          <use href="#cuerpo"/>
        </g>

        <!-- cabeza: copete, pico y ojo cerrado -->
        <g class="cabeza">
          <g class="copete">
            <path transform="translate(4 3)" d="M168 92 C156 70 160 52 174 42 C178 58 188 62 192 76 C198 62 206 58 214 56 C214 72 204 84 196 92 Z" fill="#FFD166"/>
            <path d="M168 92 C156 70 160 52 174 42 C178 58 188 62 192 76 C198 62 206 58 214 56 C214 72 204 84 196 92" stroke="#0E2E2A" stroke-width="4"/>
          </g>

          <path transform="translate(4 3)" d="M246 112 C268 112 290 122 300 134 C282 146 262 150 247 146 Z" fill="#FFD166"/>
          <path d="M246 112 C268 112 290 122 300 134 C282 146 262 150 247 146" stroke="#0E2E2A" stroke-width="4"/>
          <path d="M250 134 C266 134 282 134 298 134" stroke="#0E2E2A" stroke-width="3"/>

          <!-- ojo cerrado, curva de sueño y pestañita -->
          <path d="M211 114 C217 127 231 127 237 114" stroke="#0E2E2A" stroke-width="6"/>
          <path d="M237 114 l8 -5" stroke="#0E2E2A" stroke-width="3.5"/>
        </g>
      </g>
    </g>
  </g>

  <!-- sueños: burbujas, tarjeta y las Z -->
  <g filter="url(#pulso)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle class="burbuja-nariz" cx="322" cy="162" r="8" fill="#BDF4E8" stroke="#0E2E2A" stroke-width="4"/>
    <circle class="burbuja-media" cx="346" cy="132" r="14" fill="#BDF4E8" stroke="#0E2E2A" stroke-width="4"/>

    <g class="sueno">
      <circle cx="352" cy="82" r="30" fill="#BDF4E8" stroke="#0E2E2A" stroke-width="5"/>
      <g class="carta">
        <rect x="334" y="68" width="36" height="28" rx="3" fill="#F2EBDD" stroke="#0E2E2A" stroke-width="3"/>
        <rect x="334" y="68" width="9" height="28" rx="3" fill="#FFD166" stroke="#0E2E2A" stroke-width="3"/>
        <path d="M348 78 l16 0 M348 86 l12 0" stroke="#0E2E2A" stroke-width="3" stroke-opacity=".6"/>
      </g>
    </g>

    <g stroke="#2AA795" stroke-width="7">
      <g class="z z1"><path d="M96 168 l16 0 l-16 20 l16 0" stroke-width="6"/></g>
      <g class="z z2"><path d="M62 120 l22 0 l-22 26 l22 0"/></g>
      <g class="z z3"><path d="M36 74 l30 0 l-30 34 l30 0" stroke-width="8"/></g>
    </g>
  </g>
</svg>
