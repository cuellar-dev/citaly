<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Taly de plastilina mira una llave que flota junto a la puerta cerrada de un local">
  <title>Taly de plastilina con la llave (animado)</title>

  <style>
    /* Estilo plastilina: volumen con degradados, sombra blanda, grano de
       arcilla y huellas de dedo. Taly mira la llave que flota, luego el
       candado de la puerta, se encoge (aplasta y estira, como la arcilla)
       y da un saltito con el copete. Bucle de 4.8 s. */

    .flota { animation: flota 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0%; }
    @keyframes flota {
      0%, 100% { transform: translateY(0) rotate(-8deg); }
      50%      { transform: translateY(-9px) rotate(7deg); }
    }

    .sombra-llave { transform-box: fill-box; transform-origin: center; animation: sombra-llave 2.4s ease-in-out infinite; }
    @keyframes sombra-llave {
      0%, 100% { transform: scale(1); opacity: .28; }
      50%      { transform: scale(.78); opacity: .16; }
    }

    .cuerpo-taly { transform-origin: 200px 360px; animation: aplasta 4.8s ease-in-out infinite; }
    @keyframes aplasta {
      0%, 52%, 100% { transform: scale(1, 1); }
      58%           { transform: scale(1.05, .93); }
      66%           { transform: scale(.97, 1.05); }
      74%           { transform: scale(1.01, .99); }
    }

    .cabeza { transform-origin: 200px 170px; animation: cabeza 4.8s ease-in-out infinite; }
    @keyframes cabeza {
      0%, 8%, 100% { transform: rotate(0deg); }
      18%, 34%     { transform: rotate(7deg) translateY(2px); }
      42%, 52%     { transform: rotate(-5deg) translateY(-2px); }
      64%          { transform: rotate(0deg); }
    }

    .pupila { animation: pupila 4.8s ease-in-out infinite; }
    @keyframes pupila {
      0%, 8%, 100% { transform: translate(0, 0); }
      18%, 34%     { transform: translate(2px, 4px); }
      42%, 56%     { transform: translate(4px, -1px); }
      66%          { transform: translate(0, 0); }
    }

    .copete { transform-origin: 186px 92px; animation: copete 4.8s ease-in-out infinite; }
    @keyframes copete {
      0%, 66%, 100% { transform: rotate(0deg) translateY(0); }
      74%           { transform: rotate(-9deg) translateY(-10px); }
      82%           { transform: rotate(5deg) translateY(2px); }
      88%           { transform: rotate(0deg) translateY(0); }
    }

    .candado { transform-origin: 336px 262px; animation: candado 4.8s ease-in-out infinite; }
    @keyframes candado {
      0%, 44%, 60%, 100% { transform: rotate(0deg); }
      48%                { transform: rotate(-7deg); }
      52%                { transform: rotate(6deg); }
      56%                { transform: rotate(-3deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <defs>
    <!-- grano de arcilla: un ruido fino solo dentro de cada forma -->
    <filter id="arcilla" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7" result="ruido"/>
      <feColorMatrix in="ruido" type="matrix" values="0 0 0 0 .05  0 0 0 0 .18  0 0 0 0 .16  0 0 0 .22 0" result="grano"/>
      <feComposite in="grano" in2="SourceGraphic" operator="in" result="granoDentro"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="granoDentro"/></feMerge>
    </filter>
    <!-- sombra blanda, como una figura apoyada en la mesa -->
    <filter id="apoyo" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#0E2E2A" flood-opacity=".35"/>
    </filter>
    <filter id="difuso"><feGaussianBlur stdDeviation="5"/></filter>

    <radialGradient id="gCuerpo" cx=".38" cy=".3" r=".8">
      <stop offset="0" stop-color="#A4F1E5"/>
      <stop offset=".45" stop-color="#4FD8C4"/>
      <stop offset="1" stop-color="#229A87"/>
    </radialGradient>
    <radialGradient id="gBarriga" cx=".4" cy=".3" r=".8">
      <stop offset="0" stop-color="#F2FFFC"/>
      <stop offset="1" stop-color="#A9E9DC"/>
    </radialGradient>
    <radialGradient id="gAla" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#47C9B4"/>
      <stop offset="1" stop-color="#17786A"/>
    </radialGradient>
    <radialGradient id="gMostaza" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#FFEBB0"/>
      <stop offset=".5" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#DC9F22"/>
    </radialGradient>
    <linearGradient id="gPata" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD978"/>
      <stop offset="1" stop-color="#E3A42A"/>
    </linearGradient>
    <radialGradient id="gOjo" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4DCCB"/>
    </radialGradient>
    <linearGradient id="gPared" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF5EA"/>
      <stop offset="1" stop-color="#DCD2BF"/>
    </linearGradient>
    <radialGradient id="gPuerta" cx=".3" cy=".25" r=".95">
      <stop offset="0" stop-color="#FF9DB4"/>
      <stop offset=".5" stop-color="#EF476F"/>
      <stop offset="1" stop-color="#B92B50"/>
    </radialGradient>
    <radialGradient id="gArgolla" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#E9EEED"/>
      <stop offset="1" stop-color="#8C9A97"/>
    </radialGradient>
    <radialGradient id="gSuelo" cx=".5" cy=".3" r=".7">
      <stop offset="0" stop-color="#E9DFCB"/>
      <stop offset="1" stop-color="#C9BBA0"/>
    </radialGradient>

    <path id="cuerpo" d="M175 85 C215 68 246 94 249 134 C252 166 286 186 304 226 C324 278 286 328 200 330 C114 334 78 282 98 226 C116 180 150 162 152 126 C152 106 160 92 175 85 Z"/>
    <path id="ala" d="M134 204 C166 182 218 198 236 240 C220 284 160 290 128 256 C118 238 120 218 134 204 Z"/>
    <clipPath id="dentroCuerpo"><use href="#cuerpo"/></clipPath>
  </defs>

  <!-- la base de plastilina donde está todo -->
  <ellipse cx="205" cy="364" rx="190" ry="26" fill="url(#gSuelo)" filter="url(#arcilla)"/>
  <ellipse cx="205" cy="356" rx="176" ry="12" fill="#FFFFFF" opacity=".25"/>

  <!-- el local: un trozo de pared y la puerta con su candado -->
  <g filter="url(#apoyo)">
    <rect x="232" y="44" width="164" height="318" rx="20" fill="url(#gPared)" filter="url(#arcilla)"/>
    <rect x="248" y="84" width="132" height="278" rx="60" fill="url(#gPuerta)" filter="url(#arcilla)"/>
  </g>
  <!-- marco y tablones de la puerta, apretados con el dedo -->
  <g fill="none" stroke="#8E1F3D" stroke-linecap="round" opacity=".35" stroke-width="3">
    <path d="M292 104 L292 356 M336 104 L336 356"/>
  </g>
  <path d="M262 140 C270 116 292 100 316 98" fill="none" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="5" stroke-linecap="round"/>
  <!-- la manilla -->
  <circle cx="364" cy="246" r="7" fill="url(#gArgolla)"/>

  <!-- el candado -->
  <g transform="translate(-22 -18)">
  <g class="candado" filter="url(#apoyo)">
    <path d="M324 262 L324 246 C324 232 348 232 348 246 L348 262" fill="none" stroke="url(#gArgolla)" stroke-width="9" stroke-linecap="round"/>
    <rect x="314" y="256" width="44" height="38" rx="11" fill="url(#gMostaza)" filter="url(#arcilla)"/>
    <circle cx="336" cy="271" r="5" fill="#3B2A08"/>
    <path d="M336 274 L336 284" stroke="#3B2A08" stroke-width="5" stroke-linecap="round"/>
    <path d="M320 262 C323 259 328 258 332 258" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="3" stroke-linecap="round"/>
  </g>
  </g>

  <!-- la sombra de la llave en el suelo -->
  <ellipse class="sombra-llave" cx="196" cy="360" rx="20" ry="5" fill="#0E2E2A" opacity=".28"/>

  <!-- la sombra de Taly -->
  <ellipse cx="118" cy="358" rx="78" ry="9" fill="#0E2E2A" opacity=".3" filter="url(#difuso)"/>

  <!-- Taly -->
  <g transform="translate(-38 70) scale(.78)">
    <g class="cuerpo-taly">

      <!-- patas: churros de plastilina -->
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g stroke="#C98A1E" stroke-width="15">
          <path d="M180 326 L178 356 M178 356 L160 364 M178 356 L194 365"/>
          <path d="M226 327 L228 356 M228 356 L210 365 M228 356 L244 364"/>
        </g>
        <g stroke="url(#gPata)" stroke-width="11">
          <path d="M180 326 L178 356 M178 356 L160 364 M178 356 L194 365"/>
          <path d="M226 327 L228 356 M228 356 L210 365 M228 356 L244 364"/>
        </g>
      </g>

      <g filter="url(#apoyo)">
        <use href="#cuerpo" fill="url(#gCuerpo)" filter="url(#arcilla)"/>
      </g>
      <g clip-path="url(#dentroCuerpo)">
        <!-- barriga -->
        <path d="M205 214 C256 210 304 236 296 286 C288 328 236 336 190 326 C232 306 244 256 205 214 Z" fill="url(#gBarriga)" filter="url(#arcilla)"/>
        <!-- huellas de dedo en la arcilla -->
        <g fill="none" stroke="#1F8B79" stroke-opacity=".18" stroke-width="2.5" stroke-linecap="round">
          <path d="M120 250 C126 240 140 238 148 246"/>
          <path d="M116 262 C124 250 142 248 152 258"/>
          <path d="M114 274 C122 262 144 260 156 270"/>
        </g>
        <g fill="none" stroke="#6FC9B8" stroke-opacity=".35" stroke-width="2" stroke-linecap="round">
          <path d="M236 286 C244 280 256 280 262 288"/>
          <path d="M232 298 C242 290 258 290 266 300"/>
        </g>
        <!-- borde en sombra del lado de atrás -->
        <path d="M104 236 C96 276 116 316 170 330" fill="none" stroke="#11695C" stroke-opacity=".25" stroke-width="10" stroke-linecap="round"/>
      </g>
      <!-- brillo mate de arriba -->
      <path d="M170 98 C188 88 210 90 224 102" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="7" stroke-linecap="round"/>

      <!-- el ala, un pegote aplastado -->
      <g filter="url(#apoyo)">
        <use href="#ala" fill="url(#gAla)" filter="url(#arcilla)"/>
      </g>
      <g fill="none" stroke="#0E5A4F" stroke-opacity=".35" stroke-width="3" stroke-linecap="round">
        <path d="M150 220 C172 212 198 218 214 234"/>
        <path d="M144 238 C168 232 192 238 210 252"/>
        <path d="M146 256 C166 252 186 258 198 268"/>
      </g>
      <path d="M142 212 C156 202 174 200 190 204" fill="none" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"/>

      <!-- la cabeza: copete, pico y ojo -->
      <g class="cabeza">
        <g class="copete" filter="url(#apoyo)">
          <path d="M168 92 C156 70 160 52 174 42 C178 58 188 62 192 76 C198 62 206 58 214 56 C214 72 204 84 196 92 Z" fill="url(#gMostaza)" filter="url(#arcilla)"/>
        </g>

        <g filter="url(#apoyo)">
          <path d="M244 110 C268 110 292 120 302 134 C284 148 262 152 245 148 Z" fill="url(#gMostaza)" filter="url(#arcilla)"/>
        </g>
        <path d="M250 134 C266 134 282 134 296 134" stroke="#B9831A" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
        <path d="M252 118 C262 116 274 118 282 122" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="3" stroke-linecap="round"/>

        <!-- ojo: una bolita blanca con la pupila encima -->
        <circle cx="224" cy="120" r="13" fill="url(#gOjo)" filter="url(#apoyo)"/>
        <g class="pupila">
          <circle cx="226" cy="122" r="6.5" fill="#0E2E2A"/>
          <circle cx="228.5" cy="119.5" r="2" fill="#FFFFFF" opacity=".85"/>
        </g>
      </g>
    </g>
  </g>

  <!-- la llave, flotando junto a la punta del ala: parece que la sujeta -->
  <g transform="translate(176 214) scale(1.05)">
    <g class="flota" filter="url(#apoyo)" fill="none" stroke-linecap="round">
      <!-- debajo, la parte en sombra del churro; encima, la parte con luz -->
      <g stroke="#C98A1E">
        <circle cx="0" cy="1.5" r="15" stroke-width="11"/>
        <path d="M0 17 L0 66 M0 48 L13 48 M0 60 L11 60" stroke-width="10"/>
      </g>
      <g stroke="#FFD166">
        <circle cx="0" cy="0" r="15" stroke-width="8"/>
        <path d="M0 16 L0 64 M0 46 L12 46 M0 58 L10 58" stroke-width="7"/>
      </g>
      <path d="M-9 -8 C-6 -12 -1 -14 3 -14 M-2 24 L-2 44" stroke="#FFF3CC" stroke-width="2.5"/>
    </g>
  </g>

</svg>
