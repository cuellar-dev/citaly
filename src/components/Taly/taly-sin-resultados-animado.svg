<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Taly triste y llorando: no encontró resultados" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Taly sin resultados (animado)</title>

  <style>
    /* Taly no encontró nada: sollozos suaves, lágrimas que caen
       en la lupa vacía y el agua que se va acumulando dentro. */

    /* Sollozo: dos hipos seguidos y pausa, como cuando uno llora de verdad */
    .sollozo { transform-origin: 200px 335px; animation: sollozo 3s ease-in-out infinite; }
    @keyframes sollozo {
      0%, 100% { transform: scale(1, 1) translateY(0); }
      10%      { transform: scale(1.014, 1.03) translateY(-2px); }
      18%      { transform: scale(1, 1) translateY(0); }
      26%      { transform: scale(1.01, 1.02) translateY(-1.5px); }
      34%      { transform: scale(1, 1) translateY(0); }
    }

    /* La cabeza va caída y se sacude con cada hipo */
    .cabeza { transform-origin: 190px 150px; animation: cabeza 3s ease-in-out infinite; }
    @keyframes cabeza {
      0%, 100% { transform: rotate(5deg); }
      10%      { transform: rotate(3.2deg); }
      18%      { transform: rotate(5deg); }
      26%      { transform: rotate(4deg); }
      34%      { transform: rotate(5deg); }
    }

    /* El copete cuelga y se mece un poquito */
    .copete { transform-origin: 170px 100px; animation: copete 3s ease-in-out infinite; }
    @keyframes copete {
      0%, 100% { transform: rotate(0deg); }
      10%      { transform: rotate(-4deg); }
      18%      { transform: rotate(0deg); }
    }

    /* Cada lágrima nace en el ojo, resbala por la cara hasta el pico,
       cuelga un instante de la punta y cae dentro de la lupa. */
    .gota { opacity: 0; animation: gota 3s linear infinite; }
    .gota2 { animation-delay: 1s; }
    .gota3 { animation-delay: 2s; }
    @keyframes gota {
      0%   { opacity: 0; transform: translate(0, 0) scale(.3); animation-timing-function: ease-out; }
      8%   { opacity: 1; transform: translate(0, 2px) scale(1); animation-timing-function: ease-in-out; }
      30%  { opacity: 1; transform: translate(16px, 18px) scale(1); animation-timing-function: ease-in-out; }
      50%  { opacity: 1; transform: translate(53px, 27px) scale(1); animation-timing-function: ease-in-out; }
      58%  { opacity: 1; transform: translate(53px, 31px) scale(.95, 1.3); animation-timing-function: cubic-bezier(.55, 0, 1, .5); }
      88%  { opacity: 1; transform: translate(53px, 190px) scale(1); }
      94%  { opacity: 0; transform: translate(53px, 200px) scale(.8); }
      100% { opacity: 0; transform: translate(53px, 200px) scale(.8); }
    }

    /* El agua sube dentro de la lupa y luego se vacía para repetir */
    .agua { animation: agua 6s ease-in-out infinite; }
    @keyframes agua {
      0%   { transform: translateY(18px); opacity: 1; }
      75%  { transform: translateY(-12px); opacity: 1; }
      92%  { transform: translateY(-12px); opacity: 1; }
      98%  { transform: translateY(-12px); opacity: 0; }
      100% { transform: translateY(18px); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .gota1 { opacity: 1; }
      .agua { transform: translateY(-4px); }
    }
  </style>

  <defs>
    <filter id="pulso" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <path id="cuerpo" d="M175 85 C215 68 246 94 249 134 C252 166 286 186 304 226 C324 278 286 328 200 330 C114 334 78 282 98 226 C116 180 150 162 152 126 C152 106 160 92 175 85 Z"/>
    <path id="ala" d="M134 204 C166 182 218 198 236 240 C220 284 160 290 128 256 C118 238 120 218 134 204 Z"/>
    <clipPath id="dentroCuerpo"><use href="#cuerpo"/></clipPath>
    <clipPath id="dentroLente"><circle cx="284" cy="336" r="27"/></clipPath>

    <!-- gota de lágrima -->
    <path id="lagrima" d="M0 -10 C-6 -1 -8 4 -3 8 C2 11 8 8 7 3 C6 -2 2 -6 0 -10 Z"/>
  </defs>

  <g filter="url(#pulso)" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- sombrita en el suelo -->
    <path d="M110 372 C160 380 250 380 320 371" stroke="#0E2E2A" stroke-opacity=".25" stroke-width="5"/>
    <path d="M140 380 C180 386 235 386 290 380" stroke="#0E2E2A" stroke-opacity=".15" stroke-width="4"/>

    <g transform="rotate(4 200 340)">

      <!-- patas -->
      <g stroke="#0E2E2A" stroke-width="13">
        <path d="M178 326 L176 358 M176 358 L158 365 M176 358 L192 366"/>
        <path d="M226 327 L228 358 M228 358 L210 366 M228 358 L244 365"/>
      </g>
      <g stroke="#FFD166" stroke-width="6">
        <path d="M178 326 L176 358 M176 358 L158 365 M176 358 L192 366"/>
        <path d="M226 327 L228 358 M228 358 L210 366 M228 358 L244 365"/>
      </g>

      <g class="sollozo">

        <!-- relleno del cuerpo, desfasado del contorno -->
        <g transform="translate(4 3)">
          <use href="#cuerpo" fill="#4FD8C4"/>
          <g clip-path="url(#dentroCuerpo)">
            <path d="M205 214 C256 210 304 236 296 286 C288 328 236 336 190 326 C232 306 244 256 205 214 Z" fill="#BDF4E8"/>
            <g stroke="#8FE0D0" stroke-width="4">
              <path d="M240 250 l9 3 M254 266 l9 2 M232 276 l9 3 M250 289 l9 1 M232 300 l9 2 M262 248 l8 4"/>
            </g>
            <g stroke="#2FBDA8" stroke-width="4">
              <path d="M120 232 l-3 9 M108 255 l-2 9 M118 282 l2 8 M136 304 l4 7"/>
              <path d="M176 100 l8 3 M194 90 l9 1 M212 94 l8 3 M170 124 l7 -2 M168 148 l4 7 M188 168 l7 3"/>
              <path d="M268 206 l-4 8 M284 228 l-6 6 M292 252 l-8 4"/>
            </g>
          </g>
        </g>

        <!-- contorno del cuerpo, repasado -->
        <use href="#cuerpo" stroke="#0E2E2A" stroke-width="5"/>
        <g stroke="#0E2E2A" stroke-width="2" stroke-opacity=".45" transform="translate(-2 -2) rotate(.6 200 200)">
          <use href="#cuerpo"/>
        </g>

        <!-- la lupa, apoyada en el suelo; el mango sale de debajo del ala -->
        <g>
          <g stroke="#0E2E2A" stroke-width="14"><path d="M257 319 L190 275"/></g>
          <g stroke="#FFD166" stroke-width="7"><path d="M257 319 L190 275"/></g>
          <circle cx="284" cy="336" r="32" fill="#BDF4E8" fill-opacity=".4" stroke="none"/>
          <circle cx="287" cy="339" r="32" stroke="#FFD166" stroke-width="9"/>
          <circle cx="284" cy="336" r="32" stroke="#0E2E2A" stroke-width="5"/>
          <circle cx="284" cy="336" r="24" stroke="#0E2E2A" stroke-width="2" stroke-opacity=".35"/>
        </g>

        <!-- ala caída, sosteniendo la lupa -->
        <g transform="rotate(8 150 250)">
          <g transform="translate(4 3)">
            <use href="#ala" fill="#2AA795"/>
            <g stroke="#4FD8C4" stroke-width="4">
              <path d="M148 218 C172 208 200 214 216 232"/>
              <path d="M142 236 C168 228 194 234 214 248"/>
              <path d="M144 254 C166 250 188 256 202 266"/>
            </g>
          </g>
          <use href="#ala" stroke="#0E2E2A" stroke-width="4"/>
          <path d="M160 246 C176 244 192 250 204 260" stroke="#0E2E2A" stroke-width="2.5" stroke-opacity=".5"/>
        </g>

        <!-- cabeza -->
        <g class="cabeza">
          <!-- copete caído -->
          <g class="copete">
            <path transform="translate(4 3)" d="M166 94 C148 80 136 82 124 94 C134 96 142 102 148 110 C152 102 160 100 170 104 C174 100 178 96 184 92 Z" fill="#FFD166"/>
            <path d="M166 94 C148 80 136 82 124 94 C134 96 142 102 148 110 C152 102 160 100 170 104 C174 100 178 96 184 92" stroke="#0E2E2A" stroke-width="4"/>
          </g>

          <!-- pico con la boca temblorosa -->
          <path transform="translate(4 3)" d="M246 112 C268 112 290 122 300 134 C282 146 262 150 247 146 Z" fill="#FFD166"/>
          <path d="M246 112 C268 112 290 122 300 134 C282 146 262 150 247 146" stroke="#0E2E2A" stroke-width="4"/>
          <path d="M250 137 C260 132 268 142 277 136 C285 131 291 138 297 136" stroke="#0E2E2A" stroke-width="3"/>

          <!-- ojo grande y brillante, ceja triste (el extremo de dentro, arriba) -->
          <ellipse cx="224" cy="120" rx="10" ry="11" fill="#0E2E2A" stroke="none"/>
          <circle cx="221" cy="115" r="3.6" fill="#F2EBDD" stroke="none"/>
          <circle cx="228" cy="124" r="1.8" fill="#F2EBDD" stroke="none"/>
          <path d="M209 104 C220 102 232 98 242 90" stroke="#0E2E2A" stroke-width="3.5"/>

          <!-- rastro mojado: del ojo por la cara y por debajo del pico -->
          <path d="M229 131 C234 139 239 146 245 151" stroke="#A9E8F2" stroke-width="5"/>
          <path d="M247 151 C262 154 274 153 284 151" stroke="#A9E8F2" stroke-width="3.5" stroke-opacity=".8"/>
        </g>
      </g>

      <!-- agua que se acumula en la lupa -->
      <g clip-path="url(#dentroLente)">
        <g class="agua">
          <path d="M240 348 q11 -7 22 0 t22 0 t22 0 V380 H240 Z" fill="#A9E8F2" fill-opacity=".9" stroke="#0E2E2A" stroke-width="2.5" stroke-opacity=".5"/>
        </g>
      </g>

      <!-- las lágrimas: del ojo al pico y del pico a la lupa -->
      <g transform="translate(231 133)">
        <g class="gota gota1">
          <use href="#lagrima" fill="#A9E8F2" stroke="#0E2E2A" stroke-width="2.8"/>
        </g>
        <g class="gota gota2">
          <use href="#lagrima" fill="#A9E8F2" stroke="#0E2E2A" stroke-width="2.8"/>
        </g>
        <g class="gota gota3">
          <use href="#lagrima" fill="#A9E8F2" stroke="#0E2E2A" stroke-width="2.8"/>
        </g>
      </g>
    </g>
  </g>
</svg>
