<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Taly de plastilina pinta el cartel de un local nuevo con un lápiz que flota y el toldo se despliega">
  <title>Taly de plastilina pinta su local (animado)</title>

  <style>
    /* Misma plastilina que taly-plastilina-llave.svg. Taly mira cómo una
       brocha que flota pinta el cartel en blanco de su local; cuando acaba,
       el toldo se desenrolla y Taly da un saltito. Bucle de 5 s. */

    .brocha { animation: brocha 5s ease-in-out infinite; }
    @keyframes brocha {
      0%, 6%    { transform: translate(0, 0) rotate(-6deg); }
      14%       { transform: translate(28px, -4px) rotate(0deg); }
      24%       { transform: translate(62px, 4px) rotate(-8deg); }
      34%       { transform: translate(96px, -4px) rotate(0deg); }
      44%       { transform: translate(130px, 4px) rotate(-8deg); }
      54%, 60%  { transform: translate(166px, -2px) rotate(-3deg); }
      76%       { transform: translate(80px, -30px) rotate(-24deg); }
      92%, 100% { transform: translate(0, 0) rotate(-6deg); }
    }

    .pintura { stroke-dasharray: 260; animation: pintura 5s ease-in-out infinite; }
    @keyframes pintura {
      0%, 6%    { stroke-dashoffset: 260; opacity: 1; }
      56%, 88%  { stroke-dashoffset: 0; opacity: 1; }
      96%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }

    .toldo { transform-origin: 265px 196px; animation: toldo 5s ease-in-out infinite; }
    @keyframes toldo {
      0%, 58%   { transform: scaleY(.12); }
      70%       { transform: scaleY(1.06); }
      75%, 88%  { transform: scaleY(1); }
      98%, 100% { transform: scaleY(.12); }
    }

    .cuerpo-taly { transform-origin: 200px 360px; animation: salta 5s ease-in-out infinite; }
    @keyframes salta {
      0%, 66%, 100% { transform: translateY(0) scale(1, 1); }
      70%           { transform: translateY(0) scale(1.05, .93); }
      76%           { transform: translateY(-14px) scale(.96, 1.06); }
      82%           { transform: translateY(0) scale(1.04, .95); }
      86%           { transform: translateY(0) scale(1, 1); }
    }

    .cabeza { transform-origin: 200px 170px; animation: cabeza 5s ease-in-out infinite; }
    @keyframes cabeza {
      0%, 100% { transform: rotate(-6deg); }
      30%      { transform: rotate(-9deg) translateY(-2px); }
      56%      { transform: rotate(-4deg); }
    }

    .pupila { animation: pupila 5s ease-in-out infinite; }
    @keyframes pupila {
      0%, 6%, 100% { transform: translate(2px, -5px); }
      56%          { transform: translate(4px, -5px); }
      70%, 88%     { transform: translate(3px, -1px); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .pintura { stroke-dashoffset: 0; }
      .toldo { transform: scaleY(1); }
    }
  </style>

  <defs>
    <filter id="arcilla" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7" result="ruido"/>
      <feColorMatrix in="ruido" type="matrix" values="0 0 0 0 .05  0 0 0 0 .18  0 0 0 0 .16  0 0 0 .22 0" result="grano"/>
      <feComposite in="grano" in2="SourceGraphic" operator="in" result="granoDentro"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="granoDentro"/></feMerge>
    </filter>
    <filter id="apoyo" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#0E2E2A" flood-opacity=".35"/>
    </filter>
    <filter id="difuso"><feGaussianBlur stdDeviation="5"/></filter>

    <radialGradient id="gCuerpo" cx=".38" cy=".3" r=".8">
      <stop offset="0" stop-color="#A4F1E5"/>
      <stop offset=".45" stop-color="#4FD8C4"/>
      <stop offset="1" stop-color="#229A87"/>
    </radialGradient>
    <radialGradient id="gBarriga" cx=".4" cy=".3" r=".8">
      <stop offset="0" stop-color="#F2FFFC"/>
      <stop offset="1" stop-color="#A9E9DC"/>
    </radialGradient>
    <radialGradient id="gAla" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#47C9B4"/>
      <stop offset="1" stop-color="#17786A"/>
    </radialGradient>
    <radialGradient id="gMostaza" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#FFEBB0"/>
      <stop offset=".5" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#DC9F22"/>
    </radialGradient>
    <radialGradient id="gOjo" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4DCCB"/>
    </radialGradient>
    <linearGradient id="gPared" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF5EA"/>
      <stop offset="1" stop-color="#DCD2BF"/>
    </linearGradient>
    <linearGradient id="gCartel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8E0D0"/>
    </linearGradient>
    <radialGradient id="gEscaparate" cx=".3" cy=".25" r=".95">
      <stop offset="0" stop-color="#C9F6EF"/>
      <stop offset="1" stop-color="#7FCFC2"/>
    </radialGradient>
    <radialGradient id="gSuelo" cx=".5" cy=".3" r=".7">
      <stop offset="0" stop-color="#E9DFCB"/>
      <stop offset="1" stop-color="#C9BBA0"/>
    </radialGradient>
    <radialGradient id="gRollo" cx=".5" cy=".3" r=".8">
      <stop offset="0" stop-color="#9BEFE2"/>
      <stop offset="1" stop-color="#239C89"/>
    </radialGradient>

    <path id="cuerpo" d="M175 85 C215 68 246 94 249 134 C252 166 286 186 304 226 C324 278 286 328 200 330 C114 334 78 282 98 226 C116 180 150 162 152 126 C152 106 160 92 175 85 Z"/>
    <path id="ala" d="M134 204 C166 182 218 198 236 240 C220 284 160 290 128 256 C118 238 120 218 134 204 Z"/>
    <clipPath id="dentroCuerpo"><use href="#cuerpo"/></clipPath>
  </defs>

  <ellipse cx="205" cy="364" rx="190" ry="26" fill="url(#gSuelo)" filter="url(#arcilla)"/>
  <ellipse cx="205" cy="356" rx="176" ry="12" fill="#FFFFFF" opacity=".25"/>

  <!-- el local nuevo: escaparate a la izquierda y la puerta a la derecha, con su margen.
       Puerta de 84 × 176 (casi 1:2, como una de verdad); 22 de separación entre los dos y 18 de margen al borde -->
  <g filter="url(#apoyo)">
    <rect x="136" y="30" width="258" height="332" rx="20" fill="url(#gPared)" filter="url(#arcilla)"/>
  </g>
  <g filter="url(#apoyo)">
    <rect x="186" y="196" width="84" height="94" rx="12" fill="url(#gEscaparate)" filter="url(#arcilla)"/>
    <rect x="292" y="186" width="84" height="176" rx="36" fill="#2AA795" filter="url(#arcilla)"/>
  </g>
  <path d="M197 208 L217 226 M210 206 L240 234" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="4" stroke-linecap="round"/>
  <circle cx="363" cy="278" r="6" fill="#FFD166"/>

  <!-- el cartel, en blanco: aquí va el nombre del local -->
  <g filter="url(#apoyo)">
    <rect x="150" y="48" width="230" height="58" rx="12" fill="url(#gCartel)" filter="url(#arcilla)"/>
  </g>
  <!-- lo que escribe el lápiz, centrado en el cartel -->
  <path class="pintura" d="M184 78 C194 64 202 92 212 78 C222 64 230 92 240 78 C250 64 258 92 268 78 C278 64 286 92 296 78 C306 64 314 92 324 78 C334 64 342 92 352 78" fill="none" stroke="#1E2B29" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- el toldo, a lo ancho del cartel: un rollo arriba que se desenrolla -->
  <defs><clipPath id="formaToldo"><path d="M150 196 L380 196 L384 226 C378.1 236 366.1 236 360.2 226 C354.3 236 342.3 236 336.4 226 C330.4 236 318.5 236 312.6 226 C306.7 236 294.8 236 288.8 226 C282.9 236 270.9 236 265.0 226 C259.1 236 247.1 236 241.2 226 C235.3 236 223.3 236 217.4 226 C211.5 236 199.5 236 193.6 226 C187.7 236 175.7 236 169.8 226 C163.8 236 151.9 236 146.0 226 Z"/></clipPath></defs>
  <g transform="translate(0 -76)">
  <g class="toldo">
    <g filter="url(#apoyo)">
      <path d="M150 196 L380 196 L384 226 C378.1 236 366.1 236 360.2 226 C354.3 236 342.3 236 336.4 226 C330.4 236 318.5 236 312.6 226 C306.7 236 294.8 236 288.8 226 C282.9 236 270.9 236 265.0 226 C259.1 236 247.1 236 241.2 226 C235.3 236 223.3 236 217.4 226 C211.5 236 199.5 236 193.6 226 C187.7 236 175.7 236 169.8 226 C163.8 236 151.9 236 146.0 226 Z" fill="#4FD8C4" filter="url(#arcilla)"/>
      <g clip-path="url(#formaToldo)" fill="#FFD166"><rect x="169.8" y="190" width="23.8" height="50"/><rect x="217.4" y="190" width="23.8" height="50"/><rect x="265.0" y="190" width="23.8" height="50"/><rect x="312.6" y="190" width="23.8" height="50"/><rect x="360.2" y="190" width="23.8" height="50"/></g>
    </g>
  </g>
  <rect x="146" y="188" width="238" height="14" rx="7" fill="url(#gRollo)" filter="url(#apoyo)"/>
  </g>

  <!-- la sombra de Taly -->
  <ellipse cx="118" cy="358" rx="78" ry="9" fill="#0E2E2A" opacity=".3" filter="url(#difuso)"/>

  <!-- Taly -->
  <g transform="translate(-38 70) scale(.78)">
    <g class="cuerpo-taly">
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g stroke="#C98A1E" stroke-width="15">
          <path d="M180 326 L178 356 M178 356 L160 364 M178 356 L194 365"/>
          <path d="M226 327 L228 356 M228 356 L210 365 M228 356 L244 364"/>
        </g>
        <g stroke="#FFD166" stroke-width="11">
          <path d="M180 326 L178 356 M178 356 L160 364 M178 356 L194 365"/>
          <path d="M226 327 L228 356 M228 356 L210 365 M228 356 L244 364"/>
        </g>
      </g>

      <g filter="url(#apoyo)">
        <use href="#cuerpo" fill="url(#gCuerpo)" filter="url(#arcilla)"/>
      </g>
      <g clip-path="url(#dentroCuerpo)">
        <path d="M205 214 C256 210 304 236 296 286 C288 328 236 336 190 326 C232 306 244 256 205 214 Z" fill="url(#gBarriga)" filter="url(#arcilla)"/>
        <g fill="none" stroke="#1F8B79" stroke-opacity=".18" stroke-width="2.5" stroke-linecap="round">
          <path d="M120 250 C126 240 140 238 148 246"/>
          <path d="M116 262 C124 250 142 248 152 258"/>
          <path d="M114 274 C122 262 144 260 156 270"/>
        </g>
        <g fill="none" stroke="#6FC9B8" stroke-opacity=".35" stroke-width="2" stroke-linecap="round">
          <path d="M236 286 C244 280 256 280 262 288"/>
          <path d="M232 298 C242 290 258 290 266 300"/>
        </g>
        <path d="M104 236 C96 276 116 316 170 330" fill="none" stroke="#11695C" stroke-opacity=".25" stroke-width="10" stroke-linecap="round"/>
      </g>
      <path d="M170 98 C188 88 210 90 224 102" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="7" stroke-linecap="round"/>

      <!-- el ala, abierta hacia la brocha como si la guiara -->
      <g transform="rotate(-24 150 228)">
        <g filter="url(#apoyo)">
          <use href="#ala" fill="url(#gAla)" filter="url(#arcilla)"/>
        </g>
        <g fill="none" stroke="#0E5A4F" stroke-opacity=".35" stroke-width="3" stroke-linecap="round">
          <path d="M150 220 C172 212 198 218 214 234"/>
          <path d="M144 238 C168 232 192 238 210 252"/>
          <path d="M146 256 C166 252 186 258 198 268"/>
        </g>
      </g>

      <g class="cabeza">
        <g filter="url(#apoyo)">
          <path d="M168 92 C156 70 160 52 174 42 C178 58 188 62 192 76 C198 62 206 58 214 56 C214 72 204 84 196 92 Z" fill="url(#gMostaza)" filter="url(#arcilla)"/>
        </g>
        <g filter="url(#apoyo)">
          <path d="M244 110 C268 110 292 120 302 134 C284 148 262 152 245 148 Z" fill="url(#gMostaza)" filter="url(#arcilla)"/>
        </g>
        <path d="M250 134 C266 134 282 134 296 134" stroke="#B9831A" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
        <path d="M252 118 C262 116 274 118 282 122" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="3" stroke-linecap="round"/>
        <circle cx="224" cy="120" r="13" fill="url(#gOjo)" filter="url(#apoyo)"/>
        <g class="pupila">
          <circle cx="226" cy="122" r="6.5" fill="#0E2E2A"/>
          <circle cx="228.5" cy="119.5" r="2" fill="#FFFFFF" opacity=".85"/>
        </g>
      </g>
    </g>
  </g>

  <!-- el lápiz, flotando: nadie lo sujeta, pero escribe el nombre del local
       con la punta; la goma queda hacia Taly -->
  <g transform="translate(184 78)">
    <g class="brocha" filter="url(#apoyo)">
      <g transform="rotate(-60)">
        <rect x="-8" y="-106" width="16" height="16" rx="6" fill="#EF476F"/>
        <rect x="-9" y="-92" width="18" height="11" rx="2" fill="#B9C4C1"/>
        <rect x="-9" y="-92" width="18" height="3" rx="1.5" fill="#E9EEED"/>
        <rect x="-8" y="-82" width="16" height="60" fill="#FFD166"/>
        <rect x="-8" y="-82" width="5" height="60" fill="#FFE39A"/>
        <rect x="3" y="-82" width="5" height="60" fill="#F0B93E"/>
        <path d="M-8 -22 L8 -22 L3 -9 L-3 -9 Z" fill="#F6D7A7"/>
        <path d="M-3 -9 L3 -9 L0 0 Z" fill="#1E2B29"/>
      </g>
    </g>
  </g>
</svg>
