<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Taly buscando con una lupa algo que se le perdió y alegrándose al encontrarlo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Taly buscando (animado)</title>

  <style>
    /* Ciclo de 6 s: barre el suelo con la lupa con cara de curiosidad,
       y al encontrar la tarjeta se pone contento (ojo feliz, pico abierto, saltito). */

    .respira { transform-origin: 200px 335px; animation: respira 5s ease-in-out infinite; }
    @keyframes respira {
      0%, 100% { transform: scale(1, 1); }
      50%      { transform: scale(1.012, 1.024); }
    }

    /* Saltito de alegría al encontrarla */
    .salto { animation: salto 6s ease-out infinite; }
    @keyframes salto {
      0%, 68%  { transform: translateY(0); }
      73%      { transform: translateY(-10px); }
      78%      { transform: translateY(0); }
      82%      { transform: translateY(-5px); }
      86%, 100%{ transform: translateY(0); }
    }

    /* La lupa gira sobre un punto escondido DENTRO del ala, así el mango
       siempre sale de debajo del ala y nunca queda flotando. */
    .lupa { transform-origin: 185px 262px; animation: lupa 6s ease-in-out infinite; }
    @keyframes lupa {
      0%   { transform: rotate(-4deg); }
      22%  { transform: rotate(10deg); }
      40%  { transform: rotate(0deg); }
      58%  { transform: rotate(26deg); }
      70%  { transform: rotate(41deg); }
      88%  { transform: rotate(41deg); }
      100% { transform: rotate(-4deg); }
    }

    .ala { transform-origin: 150px 250px; animation: ala 6s ease-in-out infinite; }
    @keyframes ala {
      0%   { transform: rotate(0deg); }
      22%  { transform: rotate(3deg); }
      40%  { transform: rotate(0deg); }
      58%  { transform: rotate(5deg); }
      70%  { transform: rotate(8deg); }
      88%  { transform: rotate(8deg); }
      100% { transform: rotate(0deg); }
    }

    .cabeza { transform-origin: 190px 150px; animation: cabeza 6s ease-in-out infinite; }
    @keyframes cabeza {
      0%   { transform: rotate(0deg); }
      22%  { transform: rotate(1.5deg); }
      40%  { transform: rotate(.5deg); }
      58%  { transform: rotate(3deg); }
      66%  { transform: rotate(4deg); }
      74%  { transform: rotate(-3deg); }
      88%  { transform: rotate(-2deg); }
      100% { transform: rotate(0deg); }
    }

    /* Ojo atento, siguiendo el cristal */
    .ojo { animation: ojo 6s ease-in-out infinite; }
    @keyframes ojo {
      0%   { transform: translate(3px, 1px); }
      22%  { transform: translate(4px, 3px); }
      40%  { transform: translate(3px, 1px); }
      58%  { transform: translate(5px, 5px); }
      66%, 100% { transform: translate(6px, 6px); }
    }

    /* Cambio de expresión: atento -> feliz -> otra vez atento */
    .cara-atenta { animation: atenta 6s linear infinite; }
    @keyframes atenta {
      0%, 64%  { opacity: 1; }
      68%, 92% { opacity: 0; }
      96%, 100%{ opacity: 1; }
    }
    .cara-feliz { opacity: 0; animation: feliz 6s linear infinite; }
    @keyframes feliz {
      0%, 64%  { opacity: 0; }
      68%, 92% { opacity: 1; }
      96%, 100%{ opacity: 0; }
    }

    /* La tarjeta perdida */
    .objeto { opacity: .22; animation: objeto 6s ease-in-out infinite; }
    @keyframes objeto {
      0%, 62%  { opacity: .22; }
      72%, 90% { opacity: 1; }
      100%     { opacity: .22; }
    }

    /* Chispitas del hallazgo */
    .chispa { transform-box: fill-box; transform-origin: center; opacity: 0; animation: chispa 6s ease-in-out infinite; }
    .chispa2 { animation-delay: .1s; }
    .chispa3 { animation-delay: .2s; }
    @keyframes chispa {
      0%, 66%  { opacity: 0; transform: scale(.3); }
      74%      { opacity: 1; transform: scale(1.25); }
      88%      { opacity: 1; transform: scale(1); }
      96%, 100%{ opacity: 0; transform: scale(.6); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .objeto { opacity: 1; }
    }
  </style>

  <defs>
    <filter id="pulso" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <path id="cuerpo" d="M175 85 C215 68 246 94 249 134 C252 166 286 186 304 226 C324 278 286 328 200 330 C114 334 78 282 98 226 C116 180 150 162 152 126 C152 106 160 92 175 85 Z"/>
    <path id="ala" d="M134 204 C166 182 218 198 236 240 C220 284 160 290 128 256 C118 238 120 218 134 204 Z"/>
    <clipPath id="dentroCuerpo"><use href="#cuerpo"/></clipPath>
  </defs>

  <g filter="url(#pulso)" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- sombrita en el suelo -->
    <path d="M110 372 C160 380 250 380 306 371" stroke="#0E2E2A" stroke-opacity=".25" stroke-width="5"/>
    <path d="M140 380 C180 386 235 386 280 380" stroke="#0E2E2A" stroke-opacity=".15" stroke-width="4"/>

    <g transform="rotate(3 200 340)">

      <!-- lo que se le perdió: la tarjeta de cita en el suelo -->
      <g class="objeto" transform="rotate(-8 318 360)">
        <rect x="300" y="348" width="38" height="24" rx="3" fill="#F2EBDD" stroke="#0E2E2A" stroke-width="3"/>
        <rect x="300" y="348" width="10" height="24" rx="3" fill="#FFD166" stroke="#0E2E2A" stroke-width="3"/>
        <path d="M316 357 l16 0 M316 364 l12 0" stroke="#0E2E2A" stroke-width="2.5" stroke-opacity=".6"/>
      </g>

      <g class="salto">

        <!-- patas -->
        <g stroke="#0E2E2A" stroke-width="13">
          <path d="M178 326 L176 358 M176 358 L158 365 M176 358 L192 366"/>
          <path d="M226 327 L228 358 M228 358 L210 366 M228 358 L244 365"/>
        </g>
        <g stroke="#FFD166" stroke-width="6">
          <path d="M178 326 L176 358 M176 358 L158 365 M176 358 L192 366"/>
          <path d="M226 327 L228 358 M228 358 L210 366 M228 358 L244 365"/>
        </g>

        <g class="respira">

          <!-- relleno del cuerpo, desfasado del contorno -->
          <g transform="translate(4 3)">
            <use href="#cuerpo" fill="#4FD8C4"/>
            <g clip-path="url(#dentroCuerpo)">
              <path d="M205 214 C256 210 304 236 296 286 C288 328 236 336 190 326 C232 306 244 256 205 214 Z" fill="#BDF4E8"/>
              <g stroke="#8FE0D0" stroke-width="4">
                <path d="M240 250 l9 3 M254 266 l9 2 M232 276 l9 3 M250 289 l9 1 M232 300 l9 2 M262 248 l8 4"/>
              </g>
              <g stroke="#2FBDA8" stroke-width="4">
                <path d="M120 232 l-3 9 M108 255 l-2 9 M118 282 l2 8 M136 304 l4 7"/>
                <path d="M176 100 l8 3 M194 90 l9 1 M212 94 l8 3 M170 124 l7 -2 M168 148 l4 7 M188 168 l7 3"/>
                <path d="M268 206 l-4 8 M284 228 l-6 6 M292 252 l-8 4"/>
              </g>
            </g>
          </g>

          <!-- contorno del cuerpo, repasado -->
          <use href="#cuerpo" stroke="#0E2E2A" stroke-width="5"/>
          <g stroke="#0E2E2A" stroke-width="2" stroke-opacity=".45" transform="translate(-2 -2) rotate(.6 200 200)">
            <use href="#cuerpo"/>
          </g>

          <!-- LUPA: el mango nace en un punto escondido dentro del ala -->
          <g class="lupa">
            <g stroke="#0E2E2A" stroke-width="14"><path d="M299 253 L185 262"/></g>
            <g stroke="#FFD166" stroke-width="7"><path d="M299 253 L185 262"/></g>
            <circle cx="335" cy="250" r="36" fill="#BDF4E8" fill-opacity=".45" stroke="none"/>
            <circle cx="338" cy="253" r="36" stroke="#FFD166" stroke-width="9"/>
            <circle cx="335" cy="250" r="36" stroke="#0E2E2A" stroke-width="5"/>
            <circle cx="335" cy="250" r="27" stroke="#0E2E2A" stroke-width="2" stroke-opacity=".35"/>
            <path d="M313 240 C317 230 326 224 336 223" stroke="#F2EBDD" stroke-width="5"/>
          </g>

          <!-- ala sobre el mango -->
          <g class="ala">
            <g transform="translate(4 3)">
              <use href="#ala" fill="#2AA795"/>
              <g stroke="#4FD8C4" stroke-width="4">
                <path d="M148 218 C172 208 200 214 216 232"/>
                <path d="M142 236 C168 228 194 234 214 248"/>
                <path d="M144 254 C166 250 188 256 202 266"/>
              </g>
            </g>
            <use href="#ala" stroke="#0E2E2A" stroke-width="4"/>
            <path d="M160 246 C176 244 192 250 204 260" stroke="#0E2E2A" stroke-width="2.5" stroke-opacity=".5"/>
          </g>

          <!-- cabeza -->
          <g class="cabeza">
            <path transform="translate(4 3)" d="M168 92 C156 70 160 52 174 42 C178 58 188 62 192 76 C198 62 206 58 214 56 C214 72 204 84 196 92 Z" fill="#FFD166"/>
            <path d="M168 92 C156 70 160 52 174 42 C178 58 188 62 192 76 C198 62 206 58 214 56 C214 72 204 84 196 92" stroke="#0E2E2A" stroke-width="4"/>

            <!-- cara atenta: pico cerrado, ojo abierto, ceja curiosa -->
            <g class="cara-atenta">
              <path transform="translate(4 3)" d="M246 112 C268 112 290 122 300 134 C282 146 262 150 247 146 Z" fill="#FFD166"/>
              <path d="M246 112 C268 112 290 122 300 134 C282 146 262 150 247 146" stroke="#0E2E2A" stroke-width="4"/>
              <path d="M250 134 C266 134 282 134 298 134" stroke="#0E2E2A" stroke-width="3"/>
              <g class="ojo">
                <ellipse cx="222" cy="116" rx="8.5" ry="9.5" fill="#0E2E2A" stroke="none"/>
                <circle cx="224" cy="112" r="2.8" fill="#F2EBDD" stroke="none"/>
                <path d="M211 98 C219 91 231 91 239 97" stroke="#0E2E2A" stroke-width="3.5"/>
              </g>
            </g>

            <!-- cara feliz: pico abierto cantando, ojo en arco alegre -->
            <g class="cara-feliz">
              <path d="M249 131 L292 140 L249 142 Z" fill="#0E2E2A" stroke="none"/>
              <path transform="translate(4 3)" d="M246 106 C268 102 292 110 302 120 C284 132 262 134 247 130 Z" fill="#FFD166"/>
              <path d="M246 106 C268 102 292 110 302 120 C284 132 262 134 247 130" stroke="#0E2E2A" stroke-width="4"/>
              <path transform="translate(4 3)" d="M247 142 C262 142 280 146 292 156 C276 162 258 160 246 156 Z" fill="#FFD166"/>
              <path d="M247 142 C262 142 280 146 292 156 C276 162 258 160 246 156" stroke="#0E2E2A" stroke-width="4"/>
              <path d="M216 124 C221 110 235 110 240 124" stroke="#0E2E2A" stroke-width="6"/>
            </g>
          </g>
        </g>

        <!-- chispitas al encontrarla -->
        <g stroke="#FFD166" stroke-width="6">
          <g class="chispa"><path d="M290 336 l-10 -8"/></g>
          <g class="chispa chispa2"><path d="M346 326 l8 -10"/></g>
          <g class="chispa chispa3"><path d="M320 316 l0 -14"/></g>
        </g>
      </g>
    </g>
  </g>
</svg>
